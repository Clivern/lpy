[project]
name = "learn"
version = "0.1.0"
description = "Numbered Python lessons: language, stdlib, and common packages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "flask>=3.0",
    "fastapi>=0.115",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.1",
    "typer>=0.12",
    "rich>=13.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
    "pillow>=10.0",
    "sqlalchemy>=2.0",
    "pytest>=8.0",
    "hypothesis>=6.0",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "tenacity>=9.0",
    "cachetools>=5.5",
    "more-itertools>=10.0",
    "tabulate>=0.9",
    "humanize>=4.0",
    "arrow>=1.3",
    "pendulum>=3.0",
    "cryptography>=43.0",
    "passlib>=1.7",
    "aiohttp>=3.10",
    "attrs>=24.0",
    "marshmallow>=3.21",
    "loguru>=0.7",
    "structlog>=24.0",
    "Faker>=30.0",
    "freezegun>=1.5",
    "responses>=0.25",
    "starlette>=0.38",
    "uvicorn>=0.30",
    "packaging>=24.0",
]

[tool.pytest.ini_options]
testpaths = []
